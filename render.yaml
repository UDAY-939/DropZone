services:
  # Python Flask + Socket.IO Backend
  - type: web
    name: dropzone-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class gthread -w 1 --threads 8 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: dropzone-db
          property: connectionString

  # React + Vite Frontend
  - type: web
    name: dropzone-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# Managed PostgreSQL Database
databases:
  - name: dropzone-db
    databaseName: dropzone
    user: dropzone_user
    plan: free

